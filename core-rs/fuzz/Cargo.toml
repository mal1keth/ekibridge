[package]
name = "ekicore-rs-fuzz"
description = "cargo-fuzz targets that drive the C ABI of ekicore-rs."
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# A workspace of its own. The root manifest lists `core-rs/fuzz` under `exclude`, but cargo still
# treats a directory below a member (`core-rs`) as part of the root workspace without this table.
# Keeping the crate out matters: it needs nightly and libFuzzer, the workspace builds on stable.
[workspace]

# The input types live in the library so the fuzz targets and the seed generator share them.
[lib]
name = "ekicore_rs_fuzz"
path = "src/lib.rs"
test = false
doc = false

[dependencies]
arbitrary = { version = "=1.5.0", features = ["derive"] }
ekicore-abi = { path = "../../abi" }
ekicore-rs = { path = "..", default-features = false }
libfuzzer-sys = "=0.4.13"

[dev-dependencies]
hex = "=0.4.3"
serde_json = "=1.0.154"

[[bin]]
name = "aead_open"
path = "fuzz_targets/aead_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hkdf"
path = "fuzz_targets/hkdf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ffi_status"
path = "fuzz_targets/ffi_status.rs"
test = false
doc = false
bench = false

[[bin]]
name = "unwrap_blob"
path = "fuzz_targets/unwrap_blob.rs"
test = false
doc = false
bench = false

[[example]]
name = "seeds"
path = "examples/seeds.rs"
test = false
doc = false
