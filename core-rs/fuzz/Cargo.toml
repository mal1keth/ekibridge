[package]
name = "ekicore-rs-fuzz"
description = "cargo-fuzz targets that drive the C ABI of ekicore-rs."
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# A workspace of its own. The root manifest lists `core-rs/fuzz` under `exclude`, but cargo still
# treats a directory below a member (`core-rs`) as part of the root workspace without this table.
# Keeping the crate out matters: it needs nightly and libFuzzer, the workspace builds on stable.
[workspace]

[features]
# The library's features, forwarded. `pkcs11` is on, as in the library's default build, so the
# PKCS#11 configuration checks are fuzzed; no target ever names a module that exists. `pq` turns
# the hybrid KEM on: `cargo +nightly fuzz build --features pq`.
default = ["pkcs11"]
pkcs11 = ["ekicore-rs/pkcs11"]
pq = ["ekicore-rs/pq"]

# The shared decoding and checks live in a library so the targets and the seed generator share
# them.
[lib]
name = "ekicore_rs_fuzz"
path = "src/lib.rs"
test = false
doc = false

[dependencies]
ekicore-abi = { path = "../../abi" }
ekicore-rs = { path = "..", default-features = false }
libfuzzer-sys = "=0.4.13"
# The version ekicore-rs pins; the audit target recomputes record hashes with it.
sha2 = "=0.11.1"

[dev-dependencies]
hex = "=0.4.3"
serde_json = "=1.0.154"

[[bin]]
name = "aead_open"
path = "fuzz_targets/aead_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hkdf"
path = "fuzz_targets/hkdf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ffi_status"
path = "fuzz_targets/ffi_status.rs"
test = false
doc = false
bench = false

[[bin]]
name = "unwrap_blob"
path = "fuzz_targets/unwrap_blob.rs"
test = false
doc = false
bench = false

[[bin]]
name = "audit_verify"
path = "fuzz_targets/audit_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hybrid_kem"
path = "fuzz_targets/hybrid_kem.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ecdsa_sign_verify"
path = "fuzz_targets/ecdsa_sign_verify.rs"
test = false
doc = false
bench = false

[[example]]
name = "seeds"
path = "examples/seeds.rs"
test = false
doc = false
