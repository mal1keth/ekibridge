name: fuzz

# Short fuzzing runs of every target, Rust (cargo-fuzz) and C++ (libFuzzer). Each target runs from
# its committed seeds for at most 200000 executions or two minutes, whichever comes first: a smoke
# test that the targets build and hold on the seeds and on what a short run finds, not a campaign
# (campaigns are recorded in docs/findings.md). New inputs go to a scratch corpus in the runner's
# temporary directory, so the committed seeds are only read. The targets use the software key
# store only; no PKCS#11 token is needed.
#
# The hybrid KEM targets and ffi_status also run with the KEM compiled in on the Rust side. The
# C++ KEM needs OpenSSL 3.5, newer than the runner's, so the C++ job builds without it and checks
# that the KEM functions answer EKI_ERR_UNSUPPORTED with zeroed outputs.

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_FUZZ_VERSION: 0.13.2
  FUZZ_ARGS: -runs=200000 -max_total_time=120

jobs:
  rust:
    name: cargo-fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-rs/fuzz -> target
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - name: run targets
        run: |
          run() {
            features=$1
            name=$2
            scratch="$RUNNER_TEMP/corpus$features/$name"
            mkdir -p "$scratch"
            echo "::group::$name $features"
            # shellcheck disable=SC2086 # FUZZ_ARGS holds several libFuzzer flags.
            cargo +nightly fuzz run --fuzz-dir core-rs/fuzz $features "$name" \
              "$scratch" "core-rs/fuzz/corpus/$name" -- $FUZZ_ARGS
            echo "::endgroup::"
          }
          for name in ffi_status audit_verify unwrap_blob hybrid_kem aead_open hkdf ecdsa_sign_verify; do
            run "" "$name"
          done
          for name in hybrid_kem ffi_status; do
            run "--features=pq" "$name"
          done

  cpp:
    name: libFuzzer (clang)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev clang libclang-rt-18-dev
      # Older sanitizer runtimes crash at startup under the runner kernel's 32-bit mmap
      # randomisation; 28 bits is the long-standing default and works with every version.
      - name: limit mmap randomisation for sanitizers
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: build
        run: |
          cmake --preset fuzz
          cmake --build --preset fuzz
      - name: run targets
        run: |
          for name in fuzz_ffi_status fuzz_audit_verify fuzz_ks_unwrap fuzz_hybrid_kem \
                      fuzz_aead_open fuzz_hkdf fuzz_ecdsa_sign_verify; do
            scratch="$RUNNER_TEMP/corpus/$name"
            mkdir -p "$scratch"
            echo "::group::$name"
            # shellcheck disable=SC2086 # FUZZ_ARGS holds several libFuzzer flags.
            "build/fuzz/core-cpp/fuzz/$name" $FUZZ_ARGS "$scratch" "core-cpp/fuzz/corpus/$name"
            echo "::endgroup::"
          done
