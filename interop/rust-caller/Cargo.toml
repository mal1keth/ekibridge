[package]
name = "interop-rust-caller"
description = "Loads a libekicore build at runtime and runs a short scripted session against it."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "interop-rust-caller"
path = "src/main.rs"

# Neither ekicore library is a dependency: the caller loads one at run time by path. ekicore-abi
# only supplies the C types and constants of include/ekicore.h.
[dependencies]
ekicore-abi = { path = "../../abi" }
getrandom = "=0.4.3"
hex = "=0.4.3"
libloading = "=0.9.0"
