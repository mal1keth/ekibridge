[workspace]
resolver = "3"
members = [
  "abi",
  "core-rs",
  "conformance",
  "interop/rust-caller",
  "bindings/uniffi",
  "bindings/wasm",
]
exclude = ["core-rs/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
repository = "https://github.com/mal1keth/ekibridge"

[profile.release]
# Unwinding is caught at every extern fn (the FFI maps panics to a status).
panic = "unwind"
