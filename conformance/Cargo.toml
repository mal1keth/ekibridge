[package]
name = "ekicore-conformance"
description = "Conformance harness that loads libekicore and libekicore_rs and compares them."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
name = "ekicore_conformance"

[dependencies]
ekicore-abi = { path = "../abi" }
hex = "=0.4.3"
libloading = "=0.9.0"
rand_chacha = "=0.10.0"
rand_core = "=0.10.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"

[target.'cfg(unix)'.dev-dependencies]
# `mkfifo` for the audit log tests.
libc = "=0.2.191"
